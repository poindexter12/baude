name: diag-58
on:
  pull_request:
    branches: [main]
jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: run the flaky test 10x with diagnostics
        run: |
          set +e; fails=0
          for i in $(seq 1 10); do
            cargo test -p bauded lifecycle_close_manager_persistence_failure_retains_child_and_parent -- --exact manager::tests::lifecycle_close_manager_persistence_failure_retains_child_and_parent --nocapture 2>&1 | tail -40
            [ ${PIPESTATUS[0]:-$?} -ne 0 ] && fails=$((fails+1))
          done
          echo "FAILURES: $fails/10"
