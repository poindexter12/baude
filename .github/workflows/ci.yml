name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      # PR commit checks compare against origin/main, so checkout needs the
      # base history rather than Actions' default depth-one checkout.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: self-test the commit-message guard
        run: bash scripts/check-commit-message.sh --self-test
      - name: check pull request commits and title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bash scripts/check-commit-message.sh --range origin/main..HEAD
          printf '%s\n' "$PR_TITLE" | bash scripts/check-commit-message.sh -
      # The real-root observer proves itself against synthetic trees before it
      # is trusted to judge a suite run.
      - name: self-test the real-root observer
        run: bash scripts/assert-real-roots-untouched.sh --self-test
      # Bracket the suite (#72): the per-resolver guards each prove one
      # resolution is contained, but only this pair proves the aggregate claim
      # — that running the suite neither creates nor modifies the real config
      # dir, the real Claude config dir, or the real managed-worktrees root.
      - name: fingerprint the real roots before the suite
        id: roots-before
        run: bash scripts/assert-real-roots-untouched.sh before
      # Serial test execution on CI (#58): the manager close-rollback test
      # fails only on loaded 3-core CI runners with varying assertions — the
      # signature of cross-test process interference (PTY children spawned in
      # parallel with pid/pgid churn), not a lifecycle defect. Every assertion
      # stays intact; serial execution removes the interference channel.
      - run: cargo test -- --test-threads=1
      # Runs even when the suite failed: a run that fails AND leaks is the case
      # most worth catching, and the two statuses are reported independently so
      # neither masks the other. Guarded on the snapshot having been taken, so
      # an earlier failure does not turn this into a spurious "no snapshot"
      # error.
      - name: assert the suite left the real roots untouched
        if: always() && steps.roots-before.outcome == 'success'
        run: bash scripts/assert-real-roots-untouched.sh after

  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: validate compose config
        run: TS_AUTHKEY=tskey-dummy docker compose config -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: bauded:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test image
        run: |
          # The daemon appends a permission flag (PERM-01, default
          # --dangerously-skip-permissions) to BAUDE_CLAUDE_CMD; the real
          # `claude` accepts it but a bare `sleep` would choke and exit.
          # Wrap the stand-in in `sh -c` so the appended flags land as ignored
          # positionals and the process stays alive + silent → settles to
          # "waiting" (what this smoke asserts).
          docker run -d --rm --name smoke --init -p 8642:8642 \
            -e BAUDE_CLAUDE_CMD='sh -c "sleep 60"' bauded:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8642/sessions && break || sleep 1
          done
          docker exec smoke sh -c 'mkdir -p /repos/demo && git -C /repos/demo init -q'
          curl -fsS -X POST http://127.0.0.1:8642/sessions \
            -H 'content-type: application/json' -d '{"repo":"/repos/demo"}'
          # PTY settles to "waiting" after ~2s of output silence
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8642/sessions | grep -q '"status":"waiting"' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8642/sessions | grep '"status":"waiting"'
          docker rm -f smoke

  artifact-readiness:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: artifact-readiness-${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - name: resolve package version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "baude") | .version')
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: build locked release binaries
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: archive and verify both binaries
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist verify
          archive="dist/baude-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" baude bauded
          tar -C verify -xzf "$archive"
          test "$(verify/baude --version)" = "baude ${VERSION}"
          test "$(verify/bauded --version)" = "bauded ${VERSION}"
      - uses: actions/upload-artifact@v7
        with:
          name: baude-v${{ steps.version.outputs.value }}-${{ matrix.target }}
          path: dist/*.tar.gz
