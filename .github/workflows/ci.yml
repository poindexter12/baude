name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for every job; a job needing more widens it on its own.
permissions:
  contents: read

jobs:
  # One job per Ubuntu run and one per macOS shard. macOS process start is
  # several times slower than Linux and the suite spawns real git and PTYs
  # thousands of times, so the serial macOS suite is split across three runners
  # by scripts/test-shard.sh; every shard still runs its tests serially, and
  # together they run every test. Ubuntu runs the whole suite in one job under
  # its required name. The macOS required check is the check-macos job below.
  check:
    name: ${{ matrix.shards == 1 && format('check ({0})', matrix.os) || format('check ({0}, shard {1} of {2})', matrix.os, matrix.shard, matrix.shards) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, shard: 1, shards: 1 }
          - { os: macos-15, shard: 1, shards: 3 }
          - { os: macos-15, shard: 2, shards: 3 }
          - { os: macos-15, shard: 3, shards: 3 }
    runs-on: ${{ matrix.os }}
    steps:
      # PR commit checks compare against origin/main, so checkout needs the
      # base history rather than Actions' default depth-one checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      # The PWA suites are plain node:test files with no package and no
      # lockfile, so the runtime is pinned and nothing is cached.
      # Lint and self-test steps judge the commit, not the platform's test
      # split, so they run once per OS, on shard 1.
      - uses: actions/setup-node@v7
        if: matrix.shard == 1
        with:
          node-version: 26
      - name: run the PWA suites
        if: matrix.shard == 1
        run: bash scripts/check-web-suites.sh
      - run: cargo fmt --check
        if: matrix.shard == 1
      - run: cargo clippy --all-targets -- -D warnings
        if: matrix.shard == 1
      - name: self-test the commit-message guard
        if: matrix.shard == 1
        run: bash scripts/check-commit-message.sh --self-test
      - name: check pull request commits and title
        if: matrix.shard == 1 && github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bash scripts/check-commit-message.sh --range origin/main..HEAD
          printf '%s\n' "$PR_TITLE" | bash scripts/check-commit-message.sh -
      # The real-root observer proves itself against synthetic trees before it
      # is trusted to judge a suite run.
      - name: self-test the real-root observer
        if: matrix.shard == 1
        run: bash scripts/assert-real-roots-untouched.sh --self-test
      # The test leftover check proves itself the same way, against synthetic
      # fixture entries and processes, before it judges the suite.
      - name: self-test the test leftover check
        if: matrix.shard == 1
        run: bash scripts/assert-no-test-leftovers.sh --self-test
      # /usr/bin/git on macOS can be the xcrun shim, which execs the real git and
      # doubles the cost of every call. The suite makes thousands of them, so put
      # the real binary first when git resolves to the shim.
      - name: use the real git binary on macOS
        if: runner.os == 'macOS'
        run: |
          if [ "$(command -v git)" = /usr/bin/git ] && real="$(xcrun -f git 2>/dev/null)"; then
            dirname "$real" >> "$GITHUB_PATH"
          fi
      # Bracket the suite (#72): the per-resolver guards each prove one
      # resolution is contained, but only this pair proves the aggregate claim
      # — that running the suite neither creates nor modifies the real config
      # dir, the real Claude config dir, or the real managed-worktrees root.
      - name: fingerprint the real roots before the suite
        id: roots-before
        run: bash scripts/assert-real-roots-untouched.sh before
      # Serial test execution on CI (#58): the manager close-rollback test
      # fails only on loaded 3-core CI runners with varying assertions — the
      # signature of cross-test process interference (PTY children spawned in
      # parallel with pid/pgid churn), not a lifecycle defect. Every assertion
      # stays intact; serial execution removes the interference channel.
      #
      # The suite runs under the test leftover check, which fails the step on a
      # runtime orphaned while the suite runs, a process still working in its
      # TMPDIR at the end, or a fixture entry left behind. The TMPDIR comes from
      # mktemp under the runner's own TMPDIR: that keeps macOS on the /var
      # symlink the tests rely on and keeps both runners outside the checkout.
      - name: run the suite and assert it leaves no runtime or fixture entry behind
        run: bash scripts/assert-no-test-leftovers.sh run "$(mktemp -d "${TMPDIR:-/tmp}/suite-tmp.XXXXXX")" -- bash scripts/test-shard.sh ${{ matrix.shard }} ${{ matrix.shards }}
      # Runs even when the suite failed: a run that fails AND leaks is the case
      # most worth catching, and the two statuses are reported independently so
      # neither masks the other. Guarded on the snapshot having been taken, so
      # an earlier failure does not turn this into a spurious "no snapshot"
      # error.
      - name: assert the suite left the real roots untouched
        if: always() && steps.roots-before.outcome == 'success'
        run: bash scripts/assert-real-roots-untouched.sh after

  # The required check for macOS: green only when every macOS shard is green.
  # `needs` reports the check matrix as a whole, so an Ubuntu failure turns this
  # red too; the failing job is the one to read.
  check-macos:
    name: check (macos-15)
    needs: check
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: every check job passed
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "check matrix result: $RESULT"
          test "$RESULT" = success

  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: validate compose config
        run: TS_AUTHKEY=tskey-dummy docker compose config -q
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          tags: bauded:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test image
        run: |
          # The daemon appends a permission flag (PERM-01, default
          # --dangerously-skip-permissions) to BAUDE_CLAUDE_CMD; the real
          # `claude` accepts it but a bare `sleep` would choke and exit.
          # Wrap the stand-in in `sh -c` so the appended flags land as ignored
          # positionals and the process stays alive + silent → settles to
          # "waiting" (what this smoke asserts).
          docker run -d --rm --name smoke --init -p 8642:8642 \
            -e BAUDE_CLAUDE_CMD='sh -c "sleep 60"' bauded:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8642/sessions && break || sleep 1
          done
          docker exec smoke sh -c 'mkdir -p /repos/demo && git -C /repos/demo init -q'
          curl -fsS -X POST http://127.0.0.1:8642/sessions \
            -H 'content-type: application/json' -d '{"repo":"/repos/demo"}'
          # PTY settles to "waiting" after ~2s of output silence
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8642/sessions | grep -q '"status":"waiting"' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8642/sessions | grep '"status":"waiting"'
          docker rm -f smoke

  artifact-readiness:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: artifact-readiness-${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - name: resolve package version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "baude") | .version')
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: build locked release binaries
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: archive and verify both binaries
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist verify
          archive="dist/baude-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" baude bauded
          tar -C verify -xzf "$archive"
          test "$(verify/baude --version)" = "baude ${VERSION}"
          test "$(verify/bauded --version)" = "bauded ${VERSION}"
      - uses: actions/upload-artifact@v7
        with:
          name: baude-v${{ steps.version.outputs.value }}-${{ matrix.target }}
          path: dist/*.tar.gz
