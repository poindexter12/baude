name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for every job; a job needing more widens it on its own.
permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress,
# whose result no longer describes the branch. Pushes to main never cancel:
# each one gets its own full run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Used by the per-OS required checks: $1 is the runner label, $2 how many of
# that OS's jobs must have succeeded, its lint job plus every shard, or just
# the lint job when the change needs no Rust tests. Any job for that OS that
# concluded other than success or skipped fails the check, and so does a
# success count other than $2, so a shard that never ran cannot pass for one
# that did.
env:
  JOBS_PASSED: |
    set -eu
    os="$1"; want="$2"
    gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
      --jq ".jobs[] | select(.name | startswith(\"check ($os, \")) | \"\\(.conclusion)\\t\\(.name)\"" > jobs.txt
    cat jobs.txt
    passed=$(grep -c '^success	' jobs.txt || true)
    bad=$(grep -vcE '^(success|skipped)	' jobs.txt || true)
    echo "$os: $passed of $want jobs passed, $bad failed or unfinished"
    test "$bad" -eq 0 && test "$passed" -eq "$want"

jobs:
  # What this change needs, from the paths it touches (scripts/ci-changes.sh).
  # A pull request is judged by its diff from the base; every other event,
  # including each push to main, runs everything.
  changes:
    runs-on: ubuntu-22.04
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
      rust: ${{ steps.pick.outputs.rust }}
      web: ${{ steps.pick.outputs.web }}
      docker: ${{ steps.pick.outputs.docker }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: self-test the change classifier
        run: bash scripts/ci-changes.sh --self-test
      - name: pick the work this change needs
        id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE...HEAD" | tee changed.txt
            bash scripts/ci-changes.sh < changed.txt | tee -a "$GITHUB_OUTPUT"
          else
            bash scripts/ci-changes.sh --all | tee -a "$GITHUB_OUTPUT"
          fi

  # Checks that judge the commit rather than the test split. The commit and
  # title checks always run; the rest run when the change reaches what they
  # check. This job is Ubuntu only: the account runs at most five macOS jobs at
  # once, all of them shards, so macOS shard 1 runs the checks whose answer can
  # differ by platform (clippy over cfg code, the two self-tests) itself.
  lint:
    name: check (${{ matrix.os }}, lint)
    needs: changes
    strategy:
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # PR commit checks compare against origin/main, so checkout needs the
      # base history rather than Actions' default depth-one checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: self-test the commit-message guard
        run: bash scripts/check-commit-message.sh --self-test
      - name: check pull request commits and title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bash scripts/check-commit-message.sh --range origin/main..HEAD
          printf '%s\n' "$PR_TITLE" | bash scripts/check-commit-message.sh -
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          key: lint
      # The PWA suites are plain node:test files with no package and no
      # lockfile, so the runtime is pinned and nothing is cached.
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: 26
      - name: run the PWA suites
        if: needs.changes.outputs.web == 'true'
        run: bash scripts/check-web-suites.sh
      - run: cargo fmt --check
        if: needs.changes.outputs.rust == 'true'
      - run: cargo clippy --all-targets -- -D warnings
        if: needs.changes.outputs.rust == 'true'
      # The real-root observer and the test leftover check prove themselves
      # against synthetic trees, fixture entries and processes before they are
      # trusted to judge a suite run.
      - name: self-test the real-root observer
        if: needs.changes.outputs.rust == 'true'
        run: bash scripts/assert-real-roots-untouched.sh --self-test
      - name: self-test the test leftover check
        if: needs.changes.outputs.rust == 'true'
        run: bash scripts/assert-no-test-leftovers.sh --self-test

  # One job per shard of the Rust suite, for the packages the change reaches.
  # The suite spawns real git and PTYs thousands of times, so
  # scripts/test-shard.sh splits it across runners, balanced by measured time,
  # and each shard runs its tests under cargo-nextest, threads at a time, each
  # test in its own process. Together the shards of one OS run every selected
  # test.
  check:
    name: check (${{ matrix.os }}, shard ${{ matrix.shard }} of ${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # threads matches the runner's cores: 4 on Ubuntu, 3 on macOS.
          - { os: ubuntu-22.04, shard: 1, shards: 4, threads: 4 }
          - { os: ubuntu-22.04, shard: 2, shards: 4, threads: 4 }
          - { os: ubuntu-22.04, shard: 3, shards: 4, threads: 4 }
          - { os: ubuntu-22.04, shard: 4, shards: 4, threads: 4 }
          - { os: macos-15, shard: 1, shards: 5, threads: 3, lint: true, preload: 135 }
          - { os: macos-15, shard: 2, shards: 5, threads: 3 }
          - { os: macos-15, shard: 3, shards: 5, threads: 3 }
          - { os: macos-15, shard: 4, shards: 5, threads: 3 }
          - { os: macos-15, shard: 5, shards: 5, threads: 3 }
    runs-on: ${{ matrix.os }}
    env:
      # Line tables keep file and line in panics and backtraces but skip the
      # full debug info, which is most of the link time for the test binaries.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      TEST_SHARD_PACKAGES: ${{ needs.changes.outputs.packages }}
      # Shard 1's own lint work, so the deal gives it fewer tests. The deal
      # counts serial test seconds, so wall seconds of other work count times
      # threads: macOS clippy's 45 s is 135.
      TEST_SHARD_PRELOAD: ${{ matrix.preload || 5 }}
      TEST_SHARD_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      # Keep equal to nextest_version in scripts/gate.sh.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150
      - run: cargo clippy --all-targets -- -D warnings
        if: matrix.lint
      - name: self-test the real-root observer
        if: matrix.lint
        run: bash scripts/assert-real-roots-untouched.sh --self-test
      - name: self-test the test leftover check
        if: matrix.lint
        run: bash scripts/assert-no-test-leftovers.sh --self-test
      # /usr/bin/git on macOS can be the xcrun shim, which execs the real git and
      # doubles the cost of every call. The suite makes thousands of them, so put
      # the real binary first when git resolves to the shim.
      - name: use the real git binary on macOS
        if: runner.os == 'macOS'
        run: |
          if [ "$(command -v git)" = /usr/bin/git ] && real="$(xcrun -f git 2>/dev/null)"; then
            dirname "$real" >> "$GITHUB_PATH"
          fi
      # Bracket the suite (#72): the per-resolver guards each prove one
      # resolution is contained, but only this pair proves the aggregate claim
      # — that running the suite neither creates nor modifies the real config
      # dir, the real Claude config dir, or the real managed-worktrees root.
      - name: fingerprint the real roots before the suite
        id: roots-before
        run: bash scripts/assert-real-roots-untouched.sh before
      # The suite ran serially from #58, when the manager close-rollback test
      # failed on loaded 3-core runners from PTY children spawned in parallel.
      # A 2026-11-17 trial ran the whole suite 27 times under nextest at 2 to 4
      # threads, macOS 3-core runners included, with no failure and nothing
      # left behind; scripts/test-shard.sh records it. A flake that appears
      # goes back to threads: 1, never behind a retry.
      #
      # The suite runs under the test leftover check, which fails the step on a
      # runtime orphaned while the suite runs, a process still working in its
      # TMPDIR at the end, or a fixture entry left behind. The TMPDIR comes from
      # mktemp under the runner's own TMPDIR: that keeps macOS on the /var
      # symlink the tests rely on and keeps both runners outside the checkout.
      - name: run the suite and assert it leaves no runtime or fixture entry behind
        run: bash scripts/assert-no-test-leftovers.sh run "$(mktemp -d "${TMPDIR:-/tmp}/suite-tmp.XXXXXX")" -- bash scripts/test-shard.sh ${{ matrix.shard }} ${{ matrix.shards }}
      # Runs even when the suite failed: a run that fails AND leaks is the case
      # most worth catching, and the two statuses are reported independently so
      # neither masks the other. Guarded on the snapshot having been taken, so
      # an earlier failure does not turn this into a spurious "no snapshot"
      # error.
      - name: assert the suite left the real roots untouched
        if: always() && steps.roots-before.outcome == 'success'
        run: bash scripts/assert-real-roots-untouched.sh after

  # The required checks: one per OS, green only when the change classifier ran,
  # that OS's lint job passed, and, when the change needs Rust tests, every
  # shard it was dealt passed too. `needs` reports a matrix as a whole, so each
  # job reads its own OS's job conclusions from this run instead; a failing
  # Ubuntu shard turns only check (ubuntu-22.04) red.
  check-ubuntu:
    name: check (ubuntu-22.04)
    needs: [changes, lint, check]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    steps:
      - name: the change classifier ran
        run: test "${{ needs.changes.result }}" = success
      - name: the Ubuntu lint job and every Ubuntu shard it needed passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -c "$JOBS_PASSED" -- 'ubuntu-22.04' ${{ needs.changes.outputs.rust == 'true' && 5 || 1 }}
  check-macos:
    name: check (macos-15)
    needs: [changes, lint, check]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    steps:
      - name: the change classifier ran
        run: test "${{ needs.changes.result }}" = success
      - name: every macOS shard it needed passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -c "$JOBS_PASSED" -- 'macos-15' ${{ needs.changes.outputs.rust == 'true' && 5 || 0 }}

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: validate compose config
        run: TS_AUTHKEY=tskey-dummy docker compose config -q
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          tags: bauded:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test image
        run: |
          # The daemon appends a permission flag (PERM-01, default
          # --dangerously-skip-permissions) to BAUDE_CLAUDE_CMD; the real
          # `claude` accepts it but a bare `sleep` would choke and exit.
          # Wrap the stand-in in `sh -c` so the appended flags land as ignored
          # positionals and the process stays alive + silent → settles to
          # "waiting" (what this smoke asserts).
          docker run -d --rm --name smoke --init -p 8642:8642 \
            -e BAUDE_CLAUDE_CMD='sh -c "sleep 60"' bauded:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8642/sessions && break || sleep 1
          done
          docker exec smoke sh -c 'mkdir -p /repos/demo && git -C /repos/demo init -q'
          curl -fsS -X POST http://127.0.0.1:8642/sessions \
            -H 'content-type: application/json' -d '{"repo":"/repos/demo"}'
          # PTY settles to "waiting" after ~2s of output silence
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8642/sessions | grep -q '"status":"waiting"' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8642/sessions | grep '"status":"waiting"'
          docker rm -f smoke

  # Release builds for every target. Two of them need macOS runners, which
  # would queue behind the shards, so pull requests run them only when they
  # touch the release inputs: manifests, lockfile, release config or
  # workflows, which includes release-please's own pull requests. Every push
  # to main runs them.
  artifact-readiness:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: artifact-readiness-${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - name: resolve package version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "baude") | .version')
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: build locked release binaries
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: archive and verify both binaries
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist verify
          archive="dist/baude-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" baude bauded
          tar -C verify -xzf "$archive"
          test "$(verify/baude --version)" = "baude ${VERSION}"
          test "$(verify/bauded --version)" = "bauded ${VERSION}"
      - uses: actions/upload-artifact@v7
        with:
          name: baude-v${{ steps.version.outputs.value }}-${{ matrix.target }}
          path: dist/*.tar.gz
