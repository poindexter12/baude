name: release

# release-please owns the tag + GitHub Release (with changelog notes); this
# workflow attaches the built assets to that Release. Triggering on
# `release: published` (not tag push) avoids a double-release collision — the
# tag is created by release-please when its release PR merges, which publishes
# the Release, which fires this build. `github.ref_name` is the tag for a
# release event, so the image jobs below are unaffected.
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  # Multi-arch bauded image on ghcr — built natively per arch (no qemu rust
  # builds), pushed by digest, stitched into one manifest below.
  image:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: ubuntu-22.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        env:
          # The auto-uploaded .dockerbuild record artifacts have proven
          # undownloadable (broke the v0.6.0 publish job); nothing needs them.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/bauded,push-by-digest=true,name-canonical=true,push=true
      - name: export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.os }}
          path: /tmp/digests/*
          if-no-files-found: error

  image-manifest:
    needs: image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/bauded
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.ref_name }}" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        # Both binaries: the TUI and the daemon. bauded historically shipped
        # only via the ghcr image, so mise/tarball installs couldn't satisfy
        # auto_daemon's next-to-the-binary/PATH lookup — with per-workspace
        # auto-daemons that lookup is the normal path, so the daemon rides
        # along. `cargo build --release` above already builds the whole
        # workspace, bauded included.
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf \
            "dist/baude-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" baude bauded
      - uses: actions/upload-artifact@v7
        with:
          name: baude-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          # Only the binary tarballs — not image digests or any other
          # artifact a job happens to upload.
          pattern: baude-*
          merge-multiple: true
      - name: checksums
        run: cd dist && shasum -a 256 *.tar.gz > SHA256SUMS.txt
      - name: attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            dist/*
