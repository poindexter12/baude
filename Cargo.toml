[workspace]
resolver = "2"
members = ["baude-core", "baude", "bauded"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/poindexter12/baude"

[workspace.dependencies]
anyhow = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
baude-core = { path = "baude-core", version = "=2.0.0-beta" } # x-release-please-version

[profile.release]
lto = true
strip = true
