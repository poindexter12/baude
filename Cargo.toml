[package]
name = "baude"
version = "0.3.0"
edition = "2021"
description = "A TUI for running multiple Claude Code sessions in one terminal"
license = "MIT"
repository = "https://github.com/poindexter12/baude"

[dependencies]
anyhow = "1"
dirs = "5"
portable-pty = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.15"

[profile.release]
lto = true
strip = true
