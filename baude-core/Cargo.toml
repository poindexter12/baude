[package]
name = "baude-core"
description = "Session engine for baude: PTYs, backend drivers (Claude Code, opencode), persistence, git worktrees"
version = "2.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Compiles `baude_core::testing` (fixture redirects + the real-path escape
# guard) into a DEPENDENT crate's test binary. `cfg(test)` is set per crate by
# `rustc --test`, so it is false inside baude-core when cargo builds baude's or
# bauded's harness — the two binaries that leaked worktrees (#72). Downstream
# crates enable this from `[dev-dependencies]` only, which resolver v2 leaves
# unselected for `cargo build --release`.
test-support = []

[dependencies]
anyhow.workspace = true
dirs.workspace = true
libc = "0.2"
portable-pty = "0.8"
serde.workspace = true
serde_json.workspace = true
ureq = { version = "2", features = ["json"] }
vt100 = "0.15"
