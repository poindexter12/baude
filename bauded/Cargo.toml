[package]
name = "bauded"
description = "Headless baude session daemon: REST + SSE over baude-core"
version = "2.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = "0.10"
anyhow.workspace = true
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
# `dirs` is deliberately NOT a dependency of this crate. Every home resolution
# goes through `baude_core::persist::home_dir`, which is guarded; keeping the
# unguarded crate out of scope means a fourth private `expand_tilde` cannot be
# written here by accident (#72, CR-01).
baude-core.workspace = true
futures-core = "0.3"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
# Re-declares only the feature; path/version are inherited from the workspace
# dependency. Dev-dependency features are unified into the build graph only when
# a test target is in play, so `cargo build --release` still ships without the
# guard (#72, D-12).
baude-core = { workspace = true, features = ["test-support"] }
futures-util = "0.3"
http-body-util = "0.1"
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }
